<p-card>
    <p class="title">
        <i class="pi pi-exclamation-triangle mr-2" style="font-size: 1.2rem"></i>
        Absence Threshold Monitoring (≥ 50%)
    </p>
    <p class="subtitle">
        Students who have reached at least 50% of the absence limit
    </p>

    <div class="list" *ngFor="let value of students">
        <div class="card p-3">
            <div class="header">
                <div>
                    <p class="name">Bob Smith</p>
                    <p class="course">CS201 — Data Structures</p>
                </div>
                <p-tag severity="warn" [style]="{'border-radius': '18px'}" value="67% reached" [rounded]="true" />
            </div>

            <p-metergroup [value]="[value]" />
        </div>
    </div>
</p-card>
