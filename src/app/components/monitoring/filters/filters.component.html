<div class="filter">
    <p-card [style]="{ width: '100%' }" header="Filters">
        <div class="inputs" [formGroup]="globalFormGroup">

            <p-multiselect [options]="students" formControlName="studentIds" placeholder="Select Students" [maxSelectedLabels]="3" display="chip" class="w-full" />
            
            <p-multiselect [options]="courses" formControlName="courseIds" placeholder="Select Courses" [maxSelectedLabels]="3" display="chip" class="w-full" />
            
            <p-multiselect [options]="seniorities" formControlName="seniorities" placeholder="Select Seniorities" [maxSelectedLabels]="3" display="chip" class="w-full" />

            <p-button (onClick)="onSearch()" label="Search" severity="secondary" />
        </div>
    </p-card>
</div>
