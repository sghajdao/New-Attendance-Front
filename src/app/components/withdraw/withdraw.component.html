
<div *ngIf="students && requests" class="page">
    <app-teacher-list [students]="students" [withdrawnStudents]="withdrawnStudents" (student)="addToWflist($event)"></app-teacher-list>
    <app-admin-list [students]="requests" [student]="wfStudent" (withdrawnStudents)="getWithdrawnStudents($event)"></app-admin-list>
</div>

<div *ngIf="!students || !requests" class="spinner">
    <p-progress-spinner ariaLabel="loading" />
</div>

<app-navbar></app-navbar>
